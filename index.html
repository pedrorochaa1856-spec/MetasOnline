<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
Metas Online
</title>

<link rel="stylesheet"
href="style.css">

<link rel="preconnect"
href="https://fonts.googleapis.com">

<link rel="preconnect"
href="https://fonts.gstatic.com"
crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700&family=Poppins:wght@300;400;500;600&display=swap"
rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/tsparticles@2/tsparticles.bundle.min.js"></script>

</head>

<body>

<div id="particles"></div>

<div id="loginPage">

<div class="loginCard">

<h1>
METAS ONLINE
</h1>

<p>

Transforme disciplina em resultados.

</p>

<button id="guestBtn">

Entrar como Visitante

</button>

<button id="googleBtn">

Entrar com Google

</button>

</div>

</div>

<div id="app"
class="hidden">

<header>

<h1>

METAS ONLINE

</h1>

<div id="profile">

<img
id="profilePhoto">

<div>

<h3 id="profileName">

Visitante

</h3>

<p id="levelText">

Nível 1

</p>

</div>

</div>

</header>

<section class="dashboard">

<div class="card">

<h3>XP</h3>

<div class="xpBar">

<div id="xpFill"></div>

</div>

<p id="xpText">

0 / 100

</p>

</div>

<div class="card">

<h3>Streak 🔥</h3>

<h2 id="streak">

0

</h2>

</div>

<div class="card">

<h3>Metas</h3>

<h2 id="taskCount">

0

</h2>

</div>

</section>

<section class="newTask">

<h2>

Nova Meta

</h2>

<input
id="taskTitle"
placeholder="Digite sua meta">

<select
id="taskCategory">

<option>
Estudo
</option>

<option>
Academia
</option>

<option>
Trabalho
</option>

<option>
Pessoal
</option>

</select>

<select
id="taskPriority">

<option>
Baixa
</option>

<option>
Média
</option>

<option>
Alta
</option>

</select>

<input
type="date"
id="taskDate">

<button
id="addTask">

Adicionar

</button>

</section>

<section>

<h2>

Metas

</h2>

<div id="taskList">

</div>

</section>

<section>

<h2>

Conquistas

</h2>

<div id="badges">

<div class="badge">
🌱 Iniciante
</div>

</div>

</section>

</div>

<script src="app.js"></script>

</body>
</html>
