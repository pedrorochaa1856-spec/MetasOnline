<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Metas Online</title>

<link rel="stylesheet" href="style.css">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<script src="https://cdn.jsdelivr.net/npm/tsparticles@2/tsparticles.bundle.min.js"></script>

</head>
<body>

<div id="tsparticles"></div>

<div id="login-screen">

    <div class="login-card">

        <h1>🚀 Metas Online</h1>

        <p>
            Transforme objetivos em conquistas.
        </p>

        <button id="googleLogin">
            Entrar com Google
        </button>

    </div>

</div>

<div id="app" class="hidden">

<header>

    <div class="user-area">

        <img id="userPhoto">

        <div>
            <h2 id="userName"></h2>
            <p id="levelText">
                Nível 1
            </p>
        </div>

    </div>

    <button id="logoutBtn">
        Sair
    </button>

</header>

<section class="hero">

    <h1>
        🎯 Metas Online
    </h1>

    <p id="motivation">
        Cada meta concluída aproxima você da sua melhor versão.
    </p>

</section>

<section class="xp-section">

    <div class="xp-header">

        <span>XP</span>

        <span id="xpText">
            0 / 100
        </span>

    </div>

    <div class="xp-bar">

        <div id="xpFill"></div>

    </div>

</section>

<section class="stats-grid">

    <div class="stat-card">
        <h3 id="totalTasks">0</h3>
        <span>Metas</span>
    </div>

    <div class="stat-card">
        <h3 id="completedTasks">0</h3>
        <span>Concluídas</span>
    </div>

    <div class="stat-card">
        <h3 id="streakCount">0</h3>
        <span>Streak 🔥</span>
    </div>

</section>

<section class="task-section">

    <div class="task-input">

        <input
        id="taskInput"
        placeholder="Digite uma meta...">

        <button id="addTask">
            +
        </button>

    </div>

    <div id="tasksContainer">

    </div>

</section>

<section class="calendar-section">

    <h2>📅 Calendário</h2>

    <input
    type="date"
    id="goalDate">

</section>

<section class="achievements">

    <h2>🏆 Conquistas</h2>

    <div id="badges">

        <div class="badge">
            🌱 Iniciante
        </div>

        <div class="badge">
            ⚡ Produtivo
        </div>

        <div class="badge">
            👑 Mestre
        </div>

    </div>

</section>

</div>

<script type="module">

import {
initializeApp
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
getAuth,
GoogleAuthProvider,
signInWithPopup,
signOut,
onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
getFirestore
}
from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

window.firebaseConfig = {
apiKey: "AIzaSyCybN5klIKljbm7iLLpKuqRDYMf6F9xN5c",
authDomain: "metasonline-494be.firebaseapp.com",
projectId: "metasonline-494be",
storageBucket: "metasonline-494be.firebasestorage.app",
messagingSenderId: "38816047946",
appId: "1:38816047946:web:ff801af88f676d2ba797b3",
measurementId: "G-KNS9V9PGNJ"
};

window.firebaseApp =
initializeApp(
window.firebaseConfig
);

window.auth =
getAuth(
window.firebaseApp
);

window.db =
getFirestore(
window.firebaseApp
);

window.provider =
new GoogleAuthProvider();

window.signInWithPopup =
signInWithPopup;

window.signOut =
signOut;

window.onAuthStateChanged =
onAuthStateChanged;

</script>

<script src="app.js"></script>

</body>
</html>
